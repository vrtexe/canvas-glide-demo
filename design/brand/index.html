<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>CanvasGlide mark</title>
    <style>
      :root {
        color-scheme: light;
        --ink: #16171d;
        --paper: #ffffff;
        --dark: #16171d;
        --dark-ink: #f3f4f6;
        --line: #e5e4e7;
        --muted: #6b6375;
        font: 15px/1.5 system-ui, 'Segoe UI', Roboto, sans-serif;
        color: var(--ink);
        background: #f6f5f8;
      }

      body {
        margin: 0;
        padding: 32px;
      }

      h1 {
        margin: 0 0 4px;
        font-size: 24px;
        letter-spacing: -0.01em;
      }

      p {
        margin: 0 0 32px;
        color: var(--muted);
      }

      .row {
        display: grid;
        grid-template-columns: 160px 1fr 1fr;
        gap: 16px;
        align-items: stretch;
        margin-bottom: 16px;
      }

      .name {
        align-self: center;
        font-weight: 600;
      }

      .name small {
        display: block;
        color: var(--muted);
        font-weight: 400;
      }

      .tile {
        display: flex;
        flex-wrap: wrap;
        align-items: center;
        gap: 24px;
        padding: 20px 24px;
        border: 1px solid var(--line);
        border-radius: 16px;
        background: var(--paper);
        color: var(--ink);
      }

      .tile.dark {
        border-color: #2e303a;
        background: var(--dark);
        color: var(--dark-ink);
      }

      .tile svg {
        display: block;
      }

      .lockup {
        display: inline-flex;
        align-items: center;
        gap: 10px;
        font-size: 20px;
        font-weight: 600;
        letter-spacing: -0.01em;
      }

      .tab {
        display: inline-flex;
        align-items: center;
        gap: 6px;
        padding: 6px 10px;
        border-radius: 8px 8px 0 0;
        background: color-mix(in srgb, currentColor 8%, transparent);
        font-size: 12px;
      }
    </style>
  </head>
  <body>
    <h1>CanvasGlide mark</h1>
    <p>Three candidates at 16, 24, 32, 48 and 96 px, in a browser tab and next to the wordmark, on light and dark.</p>
    <div id="rows"></div>

    <script type="module">
      const marks = [
        ['frame', 'Frame', 'Viewport corners, content panned inside'],
        ['glide', 'Glide', 'Two overlapping squares, one moved'],
        ['pinch', 'Pinch', 'Content with a zoom gesture'],
      ];
      const sizes = [16, 24, 32, 48, 96];

      for (const [id, name, note] of marks) {
        // The ink is drawn in currentColor here, so the same mark serves both grounds.
        const svg = (await (await fetch(`./mark-${id}.svg`)).text()).replaceAll('#16171d', 'currentColor').replace(/<title>.*<\/title>/, '');
        const at = (size) => svg.replace('<svg ', `<svg width="${size}" height="${size}" `);
        const tile = (dark) => `
          <div class="tile${dark ? ' dark' : ''}">
            ${sizes.map(at).join('')}
            <span class="tab">${at(16)}CanvasGlide demo</span>
            <span class="lockup">${at(28)}CanvasGlide</span>
          </div>`;
        document.querySelector('#rows').insertAdjacentHTML(
          'beforeend',
          `<section class="row"><div class="name">${name}<small>${note}</small></div>${tile(false)}${tile(true)}</section>`,
        );
      }
    </script>
  </body>
</html>
