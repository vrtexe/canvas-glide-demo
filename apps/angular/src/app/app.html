<div class="toolbar toolbar--tabs">
  @for (t of tabs; track t.value) {
    <button class="tab" [class.tab--active]="t === tab()" (click)="tab.set(t)">{{ t.label }}</button>
  }
</div>

<div class="toolbar-row">
  <div class="toolbar toolbar--controls">
    <button class="icon-btn" title="Zoom in" (click)="viewer.glide.zoomIn()">+</button>
    <button class="icon-btn" title="Zoom out" (click)="viewer.glide.zoomOut()">−</button>
    <span class="divider"></span>
    <button data-icon="center" (click)="viewer.glide.center()">Center</button>
    <button data-icon="fit" (click)="viewer.glide.fit()">Fit</button>
  </div>
</div>

<div style="width: 100dvw; height: 100dvh; overflow: hidden">
  <glide-canvas #viewer [renderer]="tab().renderer" [image]="file()" />
</div>
