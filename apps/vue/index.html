<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" type="image/svg+xml" href="./favicon.svg" />
    <title>canvas-glide · Vue</title>
    <script>
      // The theme is picked in the demo's header and reaches this frame through localStorage.
      {
        const apply = (theme) =>
          theme === 'light' || theme === 'dark'
            ? (document.documentElement.dataset.theme = theme)
            : delete document.documentElement.dataset.theme;
        apply(localStorage.getItem('theme'));
        addEventListener('storage', (event) => event.key === 'theme' && apply(event.newValue));
      }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
