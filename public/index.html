<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>canvas-glide demo</title>
    <meta name="description" content="Pan, zoom and pinch-to-zoom with canvas-glide in React, Solid, Svelte, Vue, Qwik and Angular." />
    <link rel="icon" type="image/svg+xml" href="./react/favicon.svg" />
    <link rel="stylesheet" href="./shell.css" />
    <script type="module" src="./shell.js"></script>
  </head>
  <body>
    <header class="header">
      <a class="brand" href="https://github.com/vrtexe/canvas-glide">canvas-glide</a>
      <nav class="toolbar tabs" role="tablist" aria-label="Framework"></nav>
      <div class="actions">
        <div class="dropdown">
          <button id="theme" class="button dropdown-trigger" type="button" aria-haspopup="listbox" aria-expanded="false" aria-controls="theme-menu">
            <span class="dropdown-value"></span>
            <svg class="dropdown-caret" width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
              <polyline points="6 9 12 15 18 9" />
            </svg>
          </button>
          <ul id="theme-menu" class="dropdown-menu" role="listbox" aria-label="Theme" hidden></ul>
        </div>
        <button id="source" class="button" type="button" aria-pressed="false" aria-controls="code">Source</button>
      </div>
    </header>

    <main class="stage">
      <iframe id="frame" title="Demo" role="tabpanel"></iframe>
      <section id="code" class="code" aria-label="Source" hidden>
        <header class="code-head">
          <span id="code-file"></span>
          <a id="code-repo" href="#">Adapter repository</a>
        </header>
        <pre><code id="code-text"></code></pre>
      </section>
    </main>
  </body>
</html>
